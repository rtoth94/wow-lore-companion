name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate Lua syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      # Parse each source file without executing WoW API calls.
      - name: Check addon Lua files
        run: |
          find LoreCompanion -type f -name '*.lua' -print0 |
            xargs -0 -r -n 1 luac5.1 -p

      - name: Check campaign request handling
        run: lua5.1 tests/campaign.lua

      - name: Check reader navigation and bookmarks
        run: lua5.1 tests/window.lua

      - name: Check story progress and search
        run: lua5.1 tests/story.lua

      - name: Check quest generation and deployment
        env:
          PYTHONPATH: .:tools/quest-data-fetcher/src
        run: python3 -m unittest discover -s tools/quest-data-fetcher/tests -v
