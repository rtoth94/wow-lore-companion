[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-data-fetcher"
dynamic = ["version"]
description = "Generate original Blizzard quest descriptions as JSON and Lua data for Lore Companion."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quest-data-fetcher = "quest_data_fetcher.cli:main"

[tool.setuptools.dynamic]
version = {attr = "quest_data_fetcher.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
